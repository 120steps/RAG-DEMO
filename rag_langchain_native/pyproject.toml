[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["runtime", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"] # FastAPI Depends 默认值是框架要求；历史 zip 行为暂不改动。

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires a real external model or service",
]
