version: 2
updates:
  - package-ecosystem: pip
    directory: /rag_langchain_native
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /rag_langchain_native
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
