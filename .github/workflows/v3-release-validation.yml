name: V3 Release Validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version (does not create a tag or release)"
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Release Candidate Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: rag_langchain_native/requirements-dev.txt}
      - run: python -m pip install --requirement rag_langchain_native/requirements-dev.txt
      - run: python -m pytest rag_langchain_native/tests -m "not live"
      - run: docker build -f rag_langchain_native/Dockerfile -t rag-v3:candidate .
      - name: Write candidate notes
        env: {CANDIDATE_VERSION: "${{ inputs.version }}"}
        run: |
          printf '# Candidate %s\n\nValidated commit: %s\nNo tag, image push, release, or deployment was performed.\n' "$CANDIDATE_VERSION" "$GITHUB_SHA" > release-validation.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: release-validation, path: release-validation.md, retention-days: 30}
