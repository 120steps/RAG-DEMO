name: V3 Offline Quality Gate

on:
  pull_request:
    paths: ["rag_langchain_native/**", ".github/**", ".dockerignore"]
  push:
    branches: [main]
    paths: ["rag_langchain_native/**", ".github/**", ".dockerignore"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag_langchain_native/requirements-dev.txt
      - run: python -m pip install --requirement rag_langchain_native/requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q rag_langchain_native
      - run: python -m ruff check --config rag_langchain_native/pyproject.toml rag_langchain_native
      - run: python -m ruff format --check --config rag_langchain_native/pyproject.toml rag_langchain_native/backup.py rag_langchain_native/rate_limit.py rag_langchain_native/runtime_lock.py rag_langchain_native/eval/quality_gate.py rag_langchain_native/tests/security rag_langchain_native/tests/test_quality_gate.py

  tests:
    name: Unit Integration Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: rag_langchain_native/requirements-dev.txt}
      - run: python -m pip install --requirement rag_langchain_native/requirements-dev.txt
      - run: python -m pytest rag_langchain_native/tests -m "not live" --junitxml=rag_langchain_native/eval/results/pytest.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: v3-test-report, path: rag_langchain_native/eval/results/pytest.xml, retention-days: 14}

  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: rag_langchain_native/requirements-dev.txt}
      - run: python -m pip install --requirement rag_langchain_native/requirements-dev.txt
      - run: python -m bandit -q -r rag_langchain_native -x rag_langchain_native/tests,rag_langchain_native/runtime
      # Chroma has four currently-unfixed advisories. Exact, expiring rationale:
      # rag_langchain_native/docs/SECURITY_RISK_ACCEPTANCE.md. Any other CVE fails.
      - run: python -m pip_audit -r rag_langchain_native/requirements.txt --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
      - run: python -m pytest rag_langchain_native/tests/security -q

  docker:
    name: Docker Build Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: {persist-credentials: false}
      - run: docker build -f rag_langchain_native/Dockerfile -t rag-v3:ci .
      - name: Start and check health/readiness
        env:
          V3_AUTH_SECRET: ci-only-secret-with-more-than-32-characters
        run: |
          docker run -d --name rag-v3-ci -p 127.0.0.1:8011:8011 -e V3_AUTH_SECRET rag-v3:ci
          for attempt in {1..30}; do curl --fail http://127.0.0.1:8011/ready && exit 0; sleep 2; done
          docker logs rag-v3-ci
          exit 1

  offline-evaluation:
    name: Offline Evaluation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: rag_langchain_native/requirements-dev.txt}
      - run: python -m pip install --requirement rag_langchain_native/requirements-dev.txt
      # 固定 Embedding/LLM fixture 验证 Retrieval、Citation、Refusal、ACL 和 Gate 退出语义。
      - run: python -m pytest rag_langchain_native/tests/test_chain.py rag_langchain_native/tests/test_retrieval_reranker.py rag_langchain_native/tests/test_enterprise_security.py rag_langchain_native/tests/test_quality_gate.py -q --junitxml=rag_langchain_native/eval/results/offline-gate.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: offline-evaluation-report, path: rag_langchain_native/eval/results/offline-gate.xml, retention-days: 14}
